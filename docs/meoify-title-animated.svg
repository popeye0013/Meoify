<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Meoify — YouTube Music, the way you want it">
  <defs>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF4D67">
        <animate attributeName="stop-color" values="#FF4D67;#FF7A9C;#A855F7;#FF4D67" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FF4D67;#FF7A9C;#A855F7" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="wideBlur" />
      <feFlood flood-color="#FF4D67" flood-opacity="0.7">
        <animate attributeName="flood-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
      </feFlood>
      <feComposite in2="wideBlur" operator="in" result="outerGlow" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="tightBlur" />
      <feFlood flood-color="#FFFFFF" flood-opacity="0.55" result="white" />
      <feComposite in="white" in2="tightBlur" operator="in" result="innerGlow" />
      <feMerge>
        <feMergeNode in="outerGlow" />
        <feMergeNode in="innerGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <mask id="reveal">
      <rect x="0" y="0" width="0" height="200" fill="#ffffff">
        <animate attributeName="width" from="0" to="640" dur="1.8s" begin="0.2s" fill="freeze" />
      </rect>
    </mask>
  </defs>

  <g mask="url(#reveal)">
    <text x="320" y="98" text-anchor="middle" font-family="'Google Sans','Product Sans',Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#titleGradient)" filter="url(#glow)">Meoify</text>
  </g>

  <g text-anchor="middle" font-family="'Google Sans','Product Sans',Arial,sans-serif" font-size="19" font-weight="600" fill="#FF7A9C">
    <text x="320" y="152" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.3;0.33;1" dur="9s" repeatCount="indefinite" />
      YouTube Music, the way you want it
    </text>
    <text x="320" y="152" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite" />
      Material 3 Expressive · Lossless · Lyrics
    </text>
    <text x="320" y="152" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.66;0.69;0.96;0.99;1" dur="9s" repeatCount="indefinite" />
      Background playback · Real artwork
    </text>
  </g>
</svg>
