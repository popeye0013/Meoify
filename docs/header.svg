<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 424 140" width="424" height="140" role="img" aria-label="Meoify">
  <defs>
    <linearGradient id="logo-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E63946"/>
      <stop offset="0.5" stop-color="#D62828"/>
      <stop offset="1" stop-color="#9D0208"/>
    </linearGradient>
    <linearGradient id="logo-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logo-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E6F0"/>
      <stop offset="1" stop-color="#7BDFF2"/>
    </linearGradient>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5A0A1B" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D62828"/>
      <stop offset="55%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#7BDFF2"/>
    </linearGradient>
    <filter id="title-glow" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="wideBlur"/>
      <feFlood flood-color="#D62828" flood-opacity="0.7" result="red"/>
      <feComposite in="red" in2="wideBlur" operator="in" result="outerGlow"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="tightBlur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.5" result="white"/>
      <feComposite in="white" in2="tightBlur" operator="in" result="innerGlow"/>
      <feMerge>
        <feMergeNode in="outerGlow"/>
        <feMergeNode in="innerGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(24 22) scale(0.1875)">
    <rect width="512" height="512" rx="118" fill="url(#logo-tile)"/>
    <rect width="512" height="512" rx="118" fill="url(#logo-shine)"/>
    <g transform="translate(256 256) scale(0.5) translate(-512 -512)" filter="url(#logo-shadow)">
      <path
        d="M360,300 L360,724 L700,512 Z"
        fill="url(#logo-play)"/>
      <path d="M470,392 L470,392 Q488,392 488,410 L488,614 Q488,632 470,632 L470,632 Q452,632 452,614 L452,410 Q452,392 470,392 Z" fill="#D62828"/>
      <path d="M540,432 L540,432 Q558,432 558,450 L558,574 Q558,592 540,592 L540,592 Q522,592 522,574 L522,450 Q522,432 540,432 Z" fill="#D62828"/>
      <path d="M610,472 L610,472 Q628,472 628,490 L628,534 Q628,552 610,552 L610,552 Q592,552 592,534 L592,490 Q592,472 610,472 Z" fill="#D62828"/>
    </g>
  </g>

  <text x="275" y="97" text-anchor="middle" font-family="'Google Sans','Product Sans',Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#title-gradient)" filter="url(#title-glow)">Meoify</text>
</svg>