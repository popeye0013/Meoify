<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Meoify</title>
  <desc id="desc">A rounded coral tile with a dark cat head and a light play triangle.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A8F"/>
      <stop offset="0.52" stop-color="#FF4D67"/>
      <stop offset="1" stop-color="#BF1B3E"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD2D9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#5A0A1B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <rect width="512" height="512" rx="118" fill="url(#shine)"/>

  <g transform="translate(61.6 61.6) scale(3.6)" filter="url(#shadow)">
    <path
      d="M30,50 L36,22 L58,38 Z M78,50 L72,22 L50,38 Z M54,58 m-25,0 a25,25 0 1,0 50,0 a25,25 0 1,0 -50,0 Z"
      fill="#14060A"/>
    <path d="M48,48 L68,58 L48,68 Z" fill="url(#play)"/>
  </g>
</svg>
